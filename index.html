<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Vault — Your Digital Bookshelf</title>
  <meta name="description" content="Discover, buy and read digital books with BookVault.">
  <meta name="theme-color" content="#1d1a14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BookVault">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <style>

:root {
    --ink: #eee6d8;
    --muted: #a49a89;
    --brand: #c28a48;
    --brand2: #dfa85f;
    --paper: #1d1a14;
    --line: #49402f;
    --white: #272219;
    --green: #8bb58a;
    --shadow: 0 14px 40px #0005;
    --gold: #c28a48;
    --cream: #eee6d8;
    --dark: #1d1a14;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.65 Georgia, "Times New Roman", serif;
}

a {
    color: inherit;
    text-decoration: none;
}

button, input, select {
    font: inherit;
}

button, .btn {
    border: 1px solid var(--gold);
    border-radius: 2px;
    padding: 12px 20px;
    background: var(--gold);
    color: #21180e;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: Arial, sans-serif;
    font-size: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: .25s ease;
}

.btn:hover, button:hover {
    background: var(--brand2);
    border-color: var(--brand2);
    transform: translateY(-2px);
}

button:disabled {
    opacity: .55;
    cursor: not-allowed;
    transform: none;
}

.btn.secondary, button.secondary {
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--line);
}

.btn.secondary:hover, button.secondary:hover {
    background: #30271b;
    border-color: var(--gold);
}

.btn.ghost, button.ghost {
    background: transparent;
    color: var(--cream);
    border: 1px solid var(--line);
}

.btn.ghost:hover, button.ghost:hover {
    border-color: var(--gold);
    color: var(--gold);
}

/* NAVIGATION */

header {
    min-height: 76px;
    background: #1d1a14;
    border-bottom: 1px solid #49402f;
    display: flex;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 5;
}

.nav {
    width: min(1240px, 92%);
    margin: auto;
    display: flex;
    align-items: center;
    gap: 26px;
}

.logo {
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 25px;
    letter-spacing: -.8px;
    color: var(--cream);
    margin-right: auto;
}

.logo span {
    color: var(--gold) !important;
}

.navlinks {
    display: flex;
    gap: 25px;
    align-items: center;
}

.navlinks a {
    color: #c3b9a9;
    font-family: Arial, sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: .2s;
}

.navlinks a:hover {
    color: var(--gold);
}

.menu {
    display: none;
}

/* MAIN */

main {
    width: min(1160px, 92%);
    margin: 44px auto 80px;
    min-height: 65vh;
}

/* HERO */

.hero {
    background: #211c14;
    color: var(--cream);
    padding: 48px;
    border: 1px solid #5c472c;
    border-radius: 0;
    display: grid;
    grid-template-columns: 1.1fr .9fr;
    align-items: center;
    gap: 35px;
    overflow: hidden;
    position: relative;
}
.hero-art img {
  display: block;
  width: 100%;
  max-width: 320px;   /* adjust to taste */
  height: auto;
  border-radius: 6px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, .35);
}
.hero::before {
    content: "";
    position: absolute;
    inset: 7px;
    border: 1px solid #8e6838;
    opacity: .35;
    pointer-events: none;
}

.hero h1 {
    font-family: Georgia, serif;
    font-size: clamp(38px, 5vw, 65px);
    line-height: 1.05;
    letter-spacing: -2px;
    font-weight: 700;
    margin: 15px 0 20px;
}

.hero p {
    color: #b8ad9c;
    max-width: 540px;
    font-size: 17px;
    line-height: 1.9;
}

.hero-art {
    font-size: 125px;
    text-align: center;
    filter: sepia(.6) drop-shadow(0 15px 20px #0009);
}

.eyebrow {
    font-family: Arial, sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--gold);
}

.hero .eyebrow {
    color: #d5a15f;
}

/* SECTIONS */

.section-head {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 15px;
    margin: 55px 0 22px;
    padding-bottom: 15px;
    border-bottom: 1px solid var(--line);
}

.section-head h2 {
    margin: 0;
    font-family: Georgia, serif;
    font-size: 30px;
    letter-spacing: -.5px;
    color: var(--cream);
}

.muted {
    color: var(--muted);
}

/* BOOK GRID */

.grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 22px;
}

.cover {
    width: 100%;
    aspect-ratio: 2 / 3;
    height: auto;
    background: #34291b;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: var(--gold);
    font-size: 60px;
    font-weight: 900;
}

.cover img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    display: block;
    background: #211c14;
}

.book-card {
    background: #262118;
    border: 1px solid #51432e;
    border-radius: 2px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform .3s, border-color .3s;
}

.book-card:hover {
    transform: translateY(-6px);
    border-color: var(--gold);
}

.book-body {
    padding: 17px;
}

.book-body h3 {
    font-family: Georgia, serif;
    font-size: 19px;
    line-height: 1.3;
    color: var(--cream);
    margin: 8px 0;
}

.category {
    font-family: Arial, sans-serif;
    font-size: 10px;
    color: var(--gold);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.author {
    font-size: 13px;
    color: #a99d8b;
    font-style: italic;
}

.desc {
    font-size: 13px;
    color: #aaa08f;
    margin: 12px 0;
    min-height: 38px;
}

.card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 17px;
    padding-top: 13px;
    border-top: 1px solid var(--line);
}

.price {
    font-family: Georgia, serif;
    font-size: 21px;
    font-weight: 700;
    color: var(--gold);
}

.card-foot .btn {
    padding: 10px 12px;
    font-size: 10px;
}

/* PAGE HEADINGS */

.page-title {
    margin: 0 0 7px;
    font-family: Georgia, serif;
    font-size: 39px;
    letter-spacing: -1px;
    color: var(--cream);
}

/* SEARCH */

.toolbar {
    display: flex;
    gap: 12px;
    margin: 25px 0;
    flex-wrap: wrap;
}

.field {
    width: 100%;
    padding: 13px 15px;
    border: 1px solid #574a35;
    border-radius: 2px;
    background: #29241b;
    color: var(--cream);
    outline: none;
}

.field::placeholder {
    color: #938875;
}

.field:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 2px #c28a4820;
}

.toolbar .field {
    max-width: 340px;
}

.toolbar select {
    max-width: 210px;
}

/* BOOK DETAILS */

.detail {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 42px;
    align-items: start;
    background: #242017;
    padding: 32px;
    border-radius: 0;
    border: 1px solid #59472e;
}

.detail .cover {
    width: 100%;
    max-width: 340px;
    aspect-ratio: 2 / 3;
    height: auto;
    border: 5px double #88643a;
}

.detail h1 {
    font-family: Georgia, serif;
    font-size: 43px;
    line-height: 1.1;
    color: var(--cream);
    margin: 12px 0;
}

.detail p {
    color: #b9ae9d;
    line-height: 1.9;
}

.detail .price {
    font-size: 30px;
    margin: 24px 0;
}

.info {
    background: #30271b;
    padding: 17px;
    border-left: 3px solid var(--gold);
    border-radius: 0;
    color: #d3b98e;
    margin-top: 25px;
    font-size: 13px;
}

/* LOGIN / REGISTER */

.auth-wrap {
    max-width: 470px;
    margin: 45px auto;
}

.panel {
    padding: 30px;
    background: #262118;
    border: 1px solid #59472e;
}

.panel h1 {
    font-family: Georgia, serif;
    color: var(--cream);
    margin: 0 0 8px;
    font-size: 32px;
}

.panel h2 {
    color: var(--cream);
}

.form {
    display: grid;
    gap: 15px;
    margin-top: 22px;
}

.form label {
    font-family: Arial, sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .5px;
    color: #d7c8b1;
}

.form label input {
    margin-top: 7px;
}

.message {
    font-size: 13px;
    color: #e18d79;
    min-height: 18px;
}

.google-btn {
    width: 100%;
    padding: 13px 16px;
    margin-top: 15px;
    background: #eee6d8;
    color: #252017;
    border: 1px solid #c6b99f;
    border-radius: 2px;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    cursor: pointer;
}

.google-btn:hover {
    background: #fff9ed;
    border-color: var(--gold);
}

.auth-link {
    color: var(--gold);
    text-decoration: underline;
}

/* CHECKOUT */

.checkout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
}

.checkout .panel {
    overflow: visible;
}

.qr {
    background: #fff;
    padding: 12px;
    border: 1px solid var(--gold);
    border-radius: 2px;
    width: max-content;
    margin: 12px auto;
}

.history {
    display: grid;
    gap: 10px;
    margin-top: 22px;
}

.history-row {
    padding: 15px;
    background: #2a251c;
    border: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 13px;
    color: var(--cream);
}

.status {
    color: var(--gold);
    font-weight: 800;
}

/* PDF READER */

.reader {
    background: #282219;
    border: 1px solid #655032;
    border-radius: 2px;
    padding: 16px;
}

.readerbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    color: var(--cream);
    margin-bottom: 14px;
}

.readerbar strong {
    margin-right: auto;
    font-family: Georgia, serif;
}

.readerbar button {
    padding: 9px 12px;
}

.pdfstage {
    background: #484034;
    border-radius: 2px;
    min-height: 450px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
    overflow: auto;
}

.pdfstage canvas {
    max-width: 100%;
    height: auto;
    box-shadow: 0 8px 30px #0008;
}

/* EMPTY STATES */

.empty {
    padding: 40px;
    text-align: center;
    background: #262118;
    border: 1px dashed #705936;
    border-radius: 2px;
    color: var(--muted);
    grid-column: 1 / -1;
}

.empty a {
    color: var(--gold);
}

/* FOOTER */

footer {
    background: #19160f;
    border-top: 1px solid #49402f;
    padding: 27px;
    text-align: center;
    color: #938875;
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
}

/* NOTICES */

.notice {
    padding: 14px 16px;
    background: #302719;
    border: 1px solid #806034;
    color: #e0bd82;
    border-radius: 2px;
    font-size: 13px;
    margin: 15px 0;
}

.category-list {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.category-chip {
    padding: 10px 17px;
    border-radius: 2px;
    background: #292319;
    border: 1px solid #665032;
    color: var(--gold);
    font-weight: 750;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: .2s;
}

.category-chip:hover {
    background: #49351d;
    color: #fff0d8;
}

/* LOADING SCREEN */

.splash {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: #1d1a14;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--cream);
    transition: opacity .45s ease, visibility .45s ease;
}

.splash.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.splash-inner {
    text-align: center;
    width: min(340px, 84%);
}

.splash-logo {
    font-family: Georgia, serif;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: -2px;
    color: var(--gold);
}

.splash-book {
    font-size: 54px;
    animation: bob 1.1s ease-in-out infinite alternate;
}

.progress-track {
    height: 4px;
    background: #ffffff20;
    border-radius: 99px;
    overflow: hidden;
    margin: 24px 0 10px;
}

.progress-fill {
    height: 100%;
    width: 0;
    background: var(--gold);
    border-radius: 99px;
    animation: loadbar 1.7s ease forwards;
}

@keyframes loadbar {
    to { width: 100%; }
}

@keyframes bob {
    to { transform: translateY(-10px) rotate(-5deg); }
}

/* RESPONSIVE */

@media(max-width: 850px) {
    .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .hero {
        padding: 35px;
        grid-template-columns: 1fr;
    }

    .hero-art {
        display: none;
    }

    .detail {
        grid-template-columns: 260px 1fr;
        gap: 25px;
    }

    .detail .cover {
        max-width: 260px;
    }

    .checkout {
        grid-template-columns: 1fr;
    }
}

@media(max-width: 600px) {
    header {
        min-height: 64px;
    }

    .nav {
        flex-wrap: wrap;
        padding: 12px 0;
    }

    .menu {
        display: inline-flex;
    }

    .navlinks {
        display: none;
        width: 100%;
        flex-direction: column;
        align-items: flex-start;
        padding: 10px 0;
    }

    .navlinks.open {
        display: flex;
    }

    .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }

    .book-body {
        padding: 12px;
    }

    .book-body h3 {
        font-size: 16px;
    }

    .cover {
        aspect-ratio: 2 / 3;
    }

    .card-foot {
        align-items: flex-start;
        flex-direction: column;
    }

    .hero {
        padding: 30px 23px;
    }

    .detail {
        grid-template-columns: 1fr;
        padding: 18px;
    }

    .detail .cover {
        width: 100%;
        max-width: 300px;
        margin: auto;
    }

    .detail h1 {
        font-size: 32px;
    }

    .page-title {
        font-size: 31px;
    }

    .panel {
        padding: 20px;
    }

    .section-head h2 {
        font-size: 24px;
    }

    .history-row {
        flex-direction: column;
    }
}
  
/* Enhanced responsive layout — overrides only */
[hidden] { display: none !important; }
html, body { max-width: 100%; overflow-x: clip; }
img, svg, video, canvas { max-width: 100%; }
main, .nav, .hero > *, .detail > *, .checkout > *, .book-card { min-width: 0; }
main { width: min(1160px, calc(100% - 40px)); margin: clamp(22px, 4vw, 44px) auto 70px; }
.nav { width: min(1240px, calc(100% - 40px)); }
.hero { grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); }
.hero-art { display: flex; align-items: center; justify-content: center; }
.hero-art img { width: min(100%, 320px); }
.grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.book-card { display: flex; flex-direction: column; }
.book-body { display: flex; flex-direction: column; flex: 1; }
.book-body .desc { flex: 1; overflow-wrap: anywhere; }
.book-body h3, .detail h1, .page-title { overflow-wrap: anywhere; }
.card-foot { margin-top: auto; }
.detail { grid-template-columns: minmax(0, 340px) minmax(0, 1fr); }
.checkout { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.qr, #qrCode { max-width: 100%; }
#qrCode img, #qrCode canvas { max-width: 100%; height: auto; }
.readerbar strong { min-width: 100%; overflow-wrap: anywhere; }
.pdfstage { min-width: 0; }
button, .btn, .field { max-width: 100%; }
@media (max-width: 1100px) {
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .nav { gap: 16px; }
  .navlinks { gap: 14px; }
}
@media (max-width: 900px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero { grid-template-columns: minmax(0, 1fr) minmax(0, .7fr); padding: 32px; gap: 18px; }
  .hero-art { display: flex; font-size: 70px; }
  .hero h1 { font-size: clamp(34px, 5vw, 48px); }
  .detail { grid-template-columns: minmax(0, 240px) minmax(0, 1fr); padding: 24px; gap: 24px; }
  .checkout { grid-template-columns: 1fr; }
}
@media (max-width: 700px) {
  header { min-height: 64px; }
  .nav { flex-wrap: wrap; gap: 10px; padding: 10px 0; }
  .logo { font-size: 23px; }
  .menu { display: inline-flex; margin-left: auto; min-width: 44px; min-height: 44px; }
  .navlinks { display: none; flex-basis: 100%; width: 100%; flex-direction: column; align-items: stretch; gap: 4px; padding: 12px 0 6px; border-top: 1px solid var(--line); }
  .navlinks.open { display: flex; }
  .navlinks a, .navlinks button { padding: 12px; text-align: left; width: 100%; justify-content: flex-start; }
  .hero { grid-template-columns: 1fr; padding: 28px 24px; }
  .hero-art { display: flex; }
  .hero-art img { width: min(100%, 220px); }
  .hero p { font-size: 15px; line-height: 1.7; }
  .detail { grid-template-columns: 1fr; }
  .detail .cover { width: min(100%, 280px); max-width: 280px; margin: auto; }
  .detail h1 { font-size: clamp(28px, 6vw, 36px); }
  .toolbar .field, .toolbar select { max-width: none; flex: 1 1 220px; }
  .section-head { align-items: flex-start; flex-wrap: wrap; }
  .section-head h2 { font-size: 25px; }
  .history-row { flex-wrap: wrap; }
}
@media (max-width: 480px) {
  main, .nav { width: calc(100% - 24px); }
  main { margin-top: 20px; margin-bottom: 45px; }
  .grid { gap: 10px; }
  .book-body { padding: 10px; }
  .book-body h3 { font-size: 15px; }
  .author, .desc { font-size: 12px; }
  .desc { min-height: 0; }
  .category { font-size: 9px; letter-spacing: 1px; }
  .price { font-size: 18px; }
  .card-foot { flex-direction: column; align-items: stretch; }
  .card-foot .btn { width: 100%; padding: 10px 7px; font-size: 10px; }
  .hero { padding: 25px 18px; }
  .hero h1 { font-size: clamp(30px, 9vw, 40px); letter-spacing: -1px; }
  .hero-art img { width: min(100%, 170px); }
  .page-title { font-size: 29px; }
  .panel, .detail { padding: 16px; }
  .auth-wrap { margin: 20px auto; }
  .section-head { margin-top: 36px; }
  .section-head h2 { font-size: 22px; }
  .section-head > .btn { width: 100%; }
  .toolbar { flex-direction: column; }
  .toolbar .field, .toolbar select { width: 100%; flex: auto; }
  .reader { padding: 9px; }
  .readerbar { gap: 7px; }
  .readerbar button { flex: 1 1 auto; padding: 9px 7px; font-size: 10px; }
  .readerbar #pageLabel { text-align: center; min-width: 58px; }
  .pdfstage { padding: 8px; min-height: 250px; }
  .empty { padding: 24px 12px; }
  footer { padding: 22px 12px; line-height: 1.6; }
}
@media (max-width: 350px) {
  .grid { grid-template-columns: 1fr; }
  .cover { max-height: 390px; }
  .hero-art img { width: 140px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* Mobile hamburger menu: keep Logout inside the three-line menu. */
@media (max-width: 700px) {
  .navlinks.open {
    max-height: calc(100vh - 80px);
    max-height: calc(100dvh - 80px);
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  #logoutBtn:not([hidden]) {

        </div>

  // SHARE BOOK
  document.getElementById("shareBookBtn").onclick = async () => {

    const shareUrl = new URL(
      `?page=book&id=${encodeURIComponent(b.id)}`,
      location.href
    ).href;

    const shareData = {
      title: `${b.title} | BookVault`,
      text: `Check out "${b.title}" by ${b.author || "BookVault"} on BookVault!`,
      url: shareUrl
    };

    const message = document.getElementById("shareBookMessage");

    try {

      if (navigator.share) {

        await navigator.share(shareData);

        message.style.color = "var(--green)";
        message.textContent = "Book shared successfully.";

      } else if (
        navigator.clipboard &&
        window.isSecureContext
      ) {

        await navigator.clipboard.writeText(shareUrl);

        message.style.color = "var(--green)";
        message.textContent = "Book link copied successfully!";

      } else {

        window.prompt("Copy this book link:", shareUrl);

      }

    } catch (error) {

      if (error.name !== "AbortError") {
        message.style.color = "#b42318";
        message.textContent = "Unable to share. Please try again.";
      }

  };
}

  root.innerHTML=`${shell("Checkout & payment","Complete your UPI payment, then submit the transaction reference.")}<div class="checkout"><section class="panel"><div class="eyebrow">Order summary</div><h2>${esc(b.title)}</h2><p class="muted">By ${esc(b.author||"BookVault")}</p><h2>${money(b.price)}</h2><div class="notice">Please pay the exact amount. Your book will be unlocked only after an administrator verifies your payment.</div></section><section class="panel"><div class="eyebrow">Pay using UPI</div><div class="qr" id="qr"><div id="qrCode"></div></div><p style="text-align:center">Pay to <strong>${esc(STORE_UPI_ID)}</strong></p><p style="text-align:center"><a class="btn secondary" href="${esc(upiUri)}">Open UPI app</a></p><form class="form" id="paymentForm"><label>UPI transaction ID / UTR<input class="field" id="utr" required minlength="8" maxlength="40" placeholder="Enter transaction reference"></label><button id="submitPayment">Submit payment details</button><div class="message" id="paymentMsg"></div></form></section></div>`;
  if(STORE_UPI_ID!=="your-upi-id@bank"){
    const script=document.createElement("script");script.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";script.onload=()=>new QRCode(document.getElementById("qrCode"),{text:upiUri,width:170,height:170});document.head.appendChild(script);
  }else{document.getElementById("qr").innerHTML="<p class='muted'>Set STORE_UPI_ID in this file to display your payment QR.</p>";}
  document.getElementById("paymentForm").onsubmit=async e=>{e.preventDefault();const utr=document.getElementById("utr").value.trim(),msg=document.getElementById("paymentMsg"),btn=document.getElementById("submitPayment");if(!/^[A-Za-z0-9-]{8,40}$/.test(utr)){msg.textContent="Enter a valid transaction reference (8–40 characters).";return;}btn.disabled=true;try{await addDoc(collection(db,"users",currentUser.uid,"requests"),{bookId:b.id,bookTitle:b.title,amount:Number(b.price),currency:"INR",paymentMethod:"UPI",upiReference:utr,status:"pending",createdAt:serverTimestamp()});msg.style.color="var(--green)";msg.textContent="Details submitted. Your payment is awaiting verification.";btn.textContent="Submitted";}catch(err){msg.textContent="Could not submit. "+err.message;btn.disabled=false;}};
}
async function renderForgotPassword() {
    root.innerHTML = `
        <div class="auth-wrap">
            <section class="panel">

                <div class="eyebrow">Account Recovery</div>

                <h1>Forgot Password?</h1>

                <p class="muted">
                    Don't worry! Enter your registered email address.
                    We'll send you a password reset link.
                </p>

                <form class="form" id="resetForm">

                    <label>
                        Email address
                        <input
                            class="field"
                            id="resetEmail"
                            type="email"
                            placeholder="Enter your email"
                            required
                        >
                    </label>

                    <button type="submit" id="resetBtn">
                        Send Reset Link
                    </button>

                    <div class="message" id="resetMessage"></div>

                </form>

                <p class="muted">
                    Remember your password?
                    <a class="auth-link" href="?page=login">
                        Back to Login
                    </a>
                </p>

            </section>
        </div>
    `;

    document.getElementById("resetForm").onsubmit = async (e) => {
        e.preventDefault();

        const email = document.getElementById("resetEmail").value.trim();
        const btn = document.getElementById("resetBtn");
        const message = document.getElementById("resetMessage");

        btn.disabled = true;
        message.textContent = "";

        try {
            await sendPasswordResetEmail(auth, email);

            message.style.color = "var(--green)";
            message.textContent =
                "Password reset link sent! Check your email inbox.";

        } catch (error) {
            message.style.color = "#b42318";
            message.textContent = error.message;

        } finally {
            btn.disabled = false;
        }
    };
}
async function renderReader(){
  if(!currentUser){go("login");return;}
  await loadBooks();await loadOwned();const b=books.find(x=>x.id===bookId);
  if(!b||!owned.has(bookId)){root.innerHTML=empty("This book is not in your library. <a href='?page=library'>Go to My Library</a>");return;}
  root.innerHTML=`${shell("Book reader",esc(b.title))}<section class="reader"><div class="readerbar"><strong id="readerTitle">${esc(b.title)}</strong><button class="secondary" id="prev">← Previous</button><span id="pageLabel">Page 1</span><button class="secondary" id="next">Next →</button><button class="ghost" id="zoomOut">−</button><button class="ghost" id="zoomIn">+</button></div><div class="pdfstage"><canvas id="pdfCanvas"></canvas></div><p id="readerMsg" style="color:white;text-align:center"></p></section>`;
  try{
    // Load the PDF directly from your local project folder.
    activePdf = await pdfjsLib.getDocument(b.pdf).promise;
    pageNo = 1;
    await drawPdf();
  }catch(e){
    document.getElementById("readerMsg").textContent =
      "Could not load the PDF. Check that this file exists: " + b.pdf + ". " + e.message;
  }
  document.getElementById("prev").onclick=async()=>{if(activePdf&&pageNo>1){pageNo--;await drawPdf();}};
  document.getElementById("next").onclick=async()=>{if(activePdf&&pageNo<activePdf.numPages){pageNo++;await drawPdf();}};
  document.getElementById("zoomIn").onclick=async()=>{zoom=Math.min(2.2,zoom+.15);if(activePdf)await drawPdf();};
  document.getElementById("zoomOut").onclick=async()=>{zoom=Math.max(.65,zoom-.15);if(activePdf)await drawPdf();};
}
async function drawPdf(){const pg=await activePdf.getPage(pageNo),viewport=pg.getViewport({scale:zoom}),canvas=document.getElementById("pdfCanvas");canvas.width=viewport.width;canvas.height=viewport.height;await pg.render({canvasContext:canvas.getContext("2d"),viewport}).promise;document.getElementById("pageLabel").textContent=`${pageNo} / ${activePdf.numPages}`;document.getElementById("readerMsg").textContent="";}

await new Promise(resolve=>{
  const unsubscribe=onAuthStateChanged(auth,user=>{
    currentUser=user;
    document.getElementById("loginLink").hidden=!!user;
    document.getElementById("registerLink").hidden=!!user;
    document.getElementById("logoutBtn").hidden=!user;
    unsubscribe();
    resolve();
  });
});
if(page==="loading"){
  await new Promise(resolve=>setTimeout(resolve,1750));
  document.getElementById("splash").classList.add("hide");
  go(currentUser ? "home" : "login");
}else{
  document.getElementById("splash").classList.add("hide");
}
try{
  if (page === "home") await renderHome();
else if (page === "shop") await renderShop();
else if (page === "book") await renderBook();
else if (page === "login") await renderAuth(false);
else if (page === "register") await renderAuth(true);
else if (page === "forgot") await renderForgotPassword();
else if (page === "library") await renderLibrary();
else if (page === "checkout") await renderCheckout();
else if (page === "reader") await renderReader();
  else root.innerHTML=empty("Page not found. <a href='?page=home'>Go home</a>");
}catch(error){
  console.error(error);
  root.innerHTML=`<section class="panel"><h2>Something went wrong</h2><p class="muted">${esc(error.message)}</p><p>Check your Firebase configuration, Firestore rules, and local PDF file paths, then refresh.</p></section>`;
}
</script>

      await navigator.serviceWorker.register("./sw.js");
      console.log("BookVault PWA registered successfully");
    } catch (error) {
      console.error("Service worker registration failed:", error);
    }
  });
}
